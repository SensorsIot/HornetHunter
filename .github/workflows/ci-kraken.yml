name: Kraken Pi

on:
  push:
    branches: [ main ]
    paths:
      - 'kraken_pi/**'
      - 'shared/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-kraken.yml'
  pull_request:
    paths:
      - 'kraken_pi/**'
      - 'shared/**'
      - 'pyproject.toml'
      - '.github/workflows/ci-kraken.yml'

jobs:
  check:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e shared
          pip install -e kraken_pi
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check kraken_pi shared

      - name: Mypy
        run: mypy kraken_pi/src shared/src

      - name: Pytest
        run: pytest kraken_pi/tests shared/tests
