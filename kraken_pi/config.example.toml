# Kraken Pi station config. Copy to /etc/hornethunter/kraken.toml and edit.

[station]
id = "kraken-01"
# Antenna array position, WGS84 degrees.
latitude = 47.3769
longitude = 8.5417

[carrier]
# LoRa DTU device node, addressed by stable identity (NFR-15.3), not a ttyACM index.
serial_url = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXX-if00"

[dtu]
# Provision the LoRa DTU from config at startup (§12): enter AT mode, write only the
# parameters that differ, verify by read-back, and always AT+EXIT. Off = assume the
# stick is already configured and leave it untouched. When enabled, MODE is forced to
# 1 (Stream, the transparent pipe) and ADDR is taken from [link] address (this
# station's number) — so a swapped or Packet-mode stick self-corrects. `channel` sets
# both TX and RX channel; sf/bw/cr/power/netid are optional and applied verbatim (BW
# is an index: 0 = 125 kHz). These MUST match the Management Pi's [dtu].
enabled = false
channel = 24
sf = 7
bw = 0
cr = 1
power = 22

[kraken]
# DoA source backend: "kraken" (live DoA feed), "simulator", or "synthetic" (bench).
backend = "kraken"
# The KrakenSDR DSP rewrites this CSV every update (all DoA formats but "Kerberos
# App"); its node server serves it. This is the only local DoA interface — there is
# no WebSocket feed. Fields: ts_ms, bearing°, conf, power_dBm, freq_Hz, ... (§12.3).
doa_url = "http://127.0.0.1:8081/DOA_value.html"
# Config writes go to this settings file atomically with ext_upd_flag (§14) — the
# vendor-documented path, no en_remote_control needed. Unset → HTTP write fallback.
# Requires the service to be allowed to write it (relax ProtectHome for the unit).
settings_path = "/home/krakenrf/krakensdr_doa/krakensdr_doa/_share/settings.json"

[stream]
# Bearing stream rate cap in Hz (§5, FR-5.3): the station transmits each new DoA
# estimate but never faster than this. The KrakenSDR DoA cadence is ~2.3 Hz (§12).
max_rate_hz = 5.0

[link]
# HH-Link station address (§18.2). `rssi_append` affects framing (FR-10.4).
address = 1
rssi_append = false

[bearing]
# Per-station reference for decimetre position offsets (§9.4).
reference_lat = 47.3769
reference_lon = 8.5417

[tdma]
# Master-scheduled TDMA (§5, §6). Off = free-running stream (current behaviour).
# When enabled, the geometry MUST match the Management Pi's [tdma] exactly.
enabled = false
period_ms = 1000
slot_ms = 125
guard_ms = 25
max_slots_per_station = 2

[supervisor]
# Fully-automatic field supervision (§5.5): watchdog the DoA feed and, on a stall,
# restart the KrakenSDR services — bounded, logged, escalating (N4/FR-22.2).
enabled = false
stall_after_s = 10.0
backoff_s = 30.0
max_attempts = 3
services = ["krakensdr"]
