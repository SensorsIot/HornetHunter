[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hornethunter-kraken"
version = "0.1.0"
description = "HornetHunter KrakenProxy for the Kraken Pi"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["hornethunter-shared", "websocket-client"]

[project.scripts]
hornethunter-kraken = "hornethunter_kraken.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hornethunter_kraken"]

[tool.hatch.metadata]
allow-direct-references = true
