[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hornethunter-management"
version = "0.1.0"
description = "HornetHunter aggregator for the Management Pi"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["hornethunter-shared", "flask", "flask-sock"]

[project.scripts]
hornethunter-management = "hornethunter_management.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hornethunter_management"]

[tool.hatch.metadata]
allow-direct-references = true
