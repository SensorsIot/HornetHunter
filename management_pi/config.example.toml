# Management Pi config. Copy to /etc/hornethunter/management.toml and edit.
# Tunables and their defaults are catalogued in the FSD (§19.2, Appendix C).

[server]
# The UI binds here; default to the local network, never a public interface
# (NFR-22.3).
listen = "192.168.50.1"
port = 8000

[carrier]
# LoRa DTU device node, addressed by stable identity (NFR-15.3).
serial_url = "/dev/serial/by-id/usb-1a86_USB_Single_Serial_XXXX-if00"
promote_probes = 3
demote_probes = 2
dwell_s = 30.0

# Configuration ARQ (§10.5) — the ONLY acknowledged path. Bearings stream
# unacknowledged (§5). The 1000 ms timeout fits the measured ~215 ms/frame airtime.
[arq]
timeout_ms = 1000
max_attempts = 5

# Health (§8) is staleness-based: RED when no bearing arrives for longer than
# staleness_threshold_s; optional ORANGE below orange_rate_fraction of the expected
# bearing rate measured over rate_window_s.
[health]
staleness_threshold_s = 1.0
rate_window_s = 10.0
expected_rate_hz = 2.3
orange_rate_fraction = 0.5

[link]
# Append RSSI to received frames (display only, NFR-8.1; affects framing, FR-10.4).
rssi_append = false

[log]
path = "/var/log/hornethunter/management.jsonl"

[mirror]
# Per-station configuration mirror, persisted across restarts (FR-7.9).
path = "/var/lib/hornethunter/mirror.json"

[tdma]
# Master-scheduled TDMA (§5, §6): the master beacons and assigns slots. Off =
# free-running stream (current behaviour). Geometry MUST match every station's
# [tdma]. `staleness_ms` drops a silent station from the slot-map (compaction).
enabled = false
period_ms = 1000
slot_ms = 125
guard_ms = 25
max_slots_per_station = 2
staleness_ms = 3000

# One [[station]] table per station. `address` is the HH-Link address (§18.2) and,
# under TDMA, the station's slot-ordering number. `reference_lat`/`reference_lon` are
# the per-station reference for decimetre position offsets (§9.4).
[[station]]
address = 1
name = "kraken-01"
reference_lat = 47.3769
reference_lon = 8.5417

[[station]]
address = 2
name = "kraken-02"
reference_lat = 47.3769
reference_lon = 8.5417
