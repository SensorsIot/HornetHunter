# Repo-root tool configuration. There is deliberately no [project] table here:
# this is a monorepo, and the installable packages live in shared/, kraken_pi/
# and management_pi/. ruff, mypy and pytest all walk up to this file, so every
# target is checked the same way.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["hornethunter_shared", "hornethunter_kraken", "hornethunter_management"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["shared/tests", "kraken_pi/tests", "management_pi/tests"]
addopts = "-q"
