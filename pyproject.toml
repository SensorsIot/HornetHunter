[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hornethunter"
version = "0.1.0"
description = "Radio direction finding tools for tracking invasive hornets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hornethunter = "hornethunter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hornethunter"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
